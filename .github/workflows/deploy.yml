name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *' # refresh the news four times a day
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Refresh news (keeps the saved headlines if a source is down)
        run: python3 pipeline/fetch_news.py
        continue-on-error: true
      - name: Build the working version (served at /)
        run: npm ci && npm run build
        working-directory: web
      - name: Build the Backup (served at /backup/)
        run: |
          npm ci && npm run build
          cp -r dist ../web/dist/backup
        working-directory: web-v2-Backup
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
